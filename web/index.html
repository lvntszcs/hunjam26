<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hunjam26</title>
<style>
  :root { --dark: #551822; --light: #C4D4DD; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--dark); color: var(--light);
    font: 13px/1 ui-monospace, Consolas, monospace; }
  body { display: flex; flex-direction: column; }

  nav { display: flex; align-items: center; gap: 20px; padding: 14px 16px; }
  nav button, nav a { all: unset; cursor: pointer; color: var(--light); }
  nav button[aria-pressed="true"] { text-decoration: underline; text-underline-offset: 4px; }
  nav :focus-visible { outline: 1px solid var(--light); outline-offset: 4px; }
  #sha { margin-left: auto; }

  main { flex: 1; position: relative; min-height: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--dark); }
  #empty { position: absolute; inset: 0; display: none; place-items: center; padding: 16px; text-align: center; }
</style>
</head>
<body>
<nav>
  <button type="button" data-branch="main">main</button>
  <button type="button" data-branch="testing">testing</button>
  <span id="sha"></span>
  <a id="full" href="main/" target="_blank" rel="noopener" title="Open in new tab">↗</a>
</nav>
<main>
  <iframe id="game" title="Game" allow="fullscreen; autoplay; gamepad"></iframe>
  <div id="empty"></div>
</main>
<script>
  const BRANCHES = ["main", "testing"];
  const frame = document.getElementById("game");
  const sha = document.getElementById("sha");
  const empty = document.getElementById("empty");
  const full = document.getElementById("full");
  const buttons = document.querySelectorAll("nav button");

  function current() {
    const h = location.hash.slice(1);
    return BRANCHES.includes(h) ? h : "main";
  }

  async function show(branch) {
    buttons.forEach(b => b.setAttribute("aria-pressed", b.dataset.branch === branch));
    full.href = branch + "/";
    sha.textContent = "";
    sha.title = "";

    let meta = null;
    try {
      const r = await fetch(branch + "/version.json", { cache: "no-store" });
      if (r.ok) meta = await r.json();
    } catch (e) { /* treated as missing */ }
    if (branch !== current()) return; // switched again while loading

    if (!meta || !meta.ok) {
      frame.style.display = "none";
      frame.removeAttribute("src");
      full.style.display = "none";
      empty.style.display = "grid";
      empty.textContent = meta ? "build failed" : "no build yet";
      return;
    }

    empty.style.display = "none";
    frame.style.display = "";
    full.style.display = "";
    frame.src = branch + "/index.html?v=" + meta.sha.slice(0, 7);
    frame.addEventListener("load", () => frame.focus(), { once: true });
    sha.textContent = meta.sha.slice(0, 7);
    sha.title = meta.message + "\n" + new Date(meta.date).toLocaleString();
  }

  buttons.forEach(b => b.addEventListener("click", () => {
    location.hash = b.dataset.branch;
  }));
  addEventListener("hashchange", () => show(current()));
  // Clicking the game area gives it keyboard focus.
  document.querySelector("main").addEventListener("pointerdown", () => frame.focus());
  show(current());
</script>
</body>
</html>
